name: FileInspectorX CI

on:
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.svg'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '**/README.*'
  push:
    branches: ['main','master','release/**']
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
      - '**/*.rst'
      - '**/*.adoc'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.gif'
      - '**/*.svg'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '**/README.*'
  workflow_dispatch:

jobs:
  build-test:
    name: Build/Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: EvotecIT/.github/actions/setup-dotnet@ec7a94defe85925f23fab68a44b4659ca71c3497
        with:
          dotnet-version: |
            8.0.x

      - name: Restore
        run: dotnet restore FileInspectorX.sln

      - name: Build
        run: dotnet build FileInspectorX.sln -c Release --no-restore

      - name: Smoke test local report service
        shell: pwsh
        run: ./Build/Test-LocalService.ps1 -ApplicationPath ./FileInspectorX.Web/bin/Release/net8.0/FileInspectorX.Web.dll

      - name: Smoke test catalog recovery
        shell: pwsh
        run: ./Build/Test-CatalogRecovery.ps1 -ApplicationPath ./FileInspectorX.Web/bin/Release/net8.0/FileInspectorX.Web.dll -ScratchDirectory ./TestResults/catalog-recovery

      - name: Smoke test local request deadlines
        shell: pwsh
        run: ./Build/Test-LocalServiceDeadlines.ps1 -ApplicationPath ./FileInspectorX.Web/bin/Release/net8.0/FileInspectorX.Web.dll -ScratchDirectory ./TestResults/service-deadlines

      - name: Smoke test PowerShell 7 Magika default
        shell: pwsh
        run: ./Build/Test-PowerShellMagika.ps1 -ModulePath ./FileInspectorX.PowerShell/bin/Release/net8.0/FileInspectorX.PowerShell.dll

      - name: Smoke test generated PowerShell help
        shell: pwsh
        run: ./Build/Test-PowerShellHelp.ps1 -ModulePath ./FileInspectorX.PowerShell/bin/Release/net8.0/FileInspectorX.PowerShell.dll

      - name: Install shared module builder
        shell: pwsh
        run: Install-Module PSPublishModule -MinimumVersion '3.0.168' -Scope CurrentUser -Force

      - name: Build unsigned packaged PowerShell module
        shell: pwsh
        run: ./Module/Build/Build-Module.ps1 -ConfigurationGateMode Build -SignModule:$false

      - name: Smoke test packaged PowerShell report profiles
        shell: pwsh
        run: |
          $modules = @(Get-ChildItem ./Artefacts/Unpacked/Modules/FileInspectorX -Filter FileInspectorX.psd1 -File -Recurse)
          if ($modules.Count -ne 1) { throw 'Expected one module from the native build.' }
          ./Build/Test-PowerShellReports.ps1 -ModulePath $modules[0].FullName

      - name: Smoke test Windows PowerShell 5.1 Magika default
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build/Test-PowerShellMagika.ps1 -ModulePath ./FileInspectorX.PowerShell/bin/Release/net472/FileInspectorX.PowerShell.dll

      - name: Smoke test packaged Windows PowerShell report profiles
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $modules = @(Get-ChildItem ./Artefacts/Unpacked/Modules/FileInspectorX -Filter FileInspectorX.psd1 -File -Recurse)
          if ($modules.Count -ne 1) { throw 'Expected one module from the native build.' }
          ./Build/Test-PowerShellReports.ps1 -ModulePath $modules[0].FullName

      - name: Smoke test generated Windows PowerShell help
        if: runner.os == 'Windows'
        shell: powershell
        run: ./Build/Test-PowerShellHelp.ps1 -ModulePath ./FileInspectorX.PowerShell/bin/Release/net472/FileInspectorX.PowerShell.dll

      - name: Smoke test 32-bit Windows PowerShell deterministic fallback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scriptPath = (Resolve-Path ./Build/Test-PowerShellMagika.ps1).Path
          $modulePath = (Resolve-Path ./FileInspectorX.PowerShell/bin/Release/net472/FileInspectorX.PowerShell.dll).Path
          & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -File $scriptPath -ModulePath $modulePath -ExpectedDefault DeterministicOnly -ExpectBundledProvider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PowerShell without Magika provider
        run: dotnet build FileInspectorX.PowerShell/FileInspectorX.PowerShell.csproj -c Release -f net8.0 -p:IncludeMagika=false -o ./TestResults/powershell-no-magika

      - name: Smoke test provider-free deterministic default
        shell: pwsh
        run: ./Build/Test-PowerShellMagika.ps1 -ModulePath ./TestResults/powershell-no-magika/FileInspectorX.PowerShell.dll -ExpectedDefault DeterministicOnly

      - name: Build packaged PowerShell with core readers only
        shell: pwsh
        env:
          IncludeOfficeIMO: 'false'
          IncludeMagika: 'false'
        run: ./Module/Build/Build-Module.ps1 -ConfigurationGateMode Build -SignModule:$false

      - name: Smoke test packaged core-only report profiles
        shell: pwsh
        run: |
          $modules = @(Get-ChildItem ./Artefacts/Unpacked/Modules/FileInspectorX -Filter FileInspectorX.psd1 -File -Recurse)
          if ($modules.Count -ne 1) { throw 'Expected one core-only module from the native build.' }
          ./Build/Test-PowerShellReports.ps1 -ModulePath $modules[0].FullName -BuiltinOnly

      - name: Test (net8.0)
        if: runner.os != 'Linux'
        run: dotnet test FileInspectorX.Tests/FileInspectorX.Tests.csproj -c Release -f net8.0 --no-build --logger "trx;LogFileName=test-results-net8.trx" --results-directory ./TestResults/net8

      - name: Test (net8.0) + Coverage
        if: runner.os == 'Linux'
        run: dotnet test FileInspectorX.Tests/FileInspectorX.Tests.csproj -c Release -f net8.0 --no-build --logger "trx;LogFileName=test-results-net8.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults/net8

      - name: Test (net472)
        if: runner.os == 'Windows'
        run: dotnet test FileInspectorX.Tests/FileInspectorX.Tests.csproj -c Release -f net472 --no-build --logger "trx;LogFileName=test-results-net472.trx" --results-directory ./TestResults/net472

      - name: Test Magika provider
        run: dotnet test FileInspectorX.Magika.Tests/FileInspectorX.Magika.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results-magika.trx" --results-directory ./TestResults/magika

      - name: Test OfficeIMO adapter
        run: dotnet test FileInspectorX.OfficeIMO.Tests/FileInspectorX.OfficeIMO.Tests.csproj -c Release -f net8.0 --no-build --logger "trx;LogFileName=test-results-officeimo.trx" --results-directory ./TestResults/officeimo

      - name: Test OfficeIMO adapter (.NET Framework)
        if: runner.os == 'Windows'
        run: dotnet test FileInspectorX.OfficeIMO.Tests/FileInspectorX.OfficeIMO.Tests.csproj -c Release -f net472 --no-build --logger "trx;LogFileName=test-results-officeimo-net472.trx" --results-directory ./TestResults/officeimo-net472

      - name: Upload test results
        if: always() && hashFiles('TestResults/**/*.trx', 'TestResults/service-deadlines/deadline-receipt.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            ./TestResults/**/*.trx
            ./TestResults/service-deadlines/deadline-receipt.json
            ./TestResults/service-deadlines/service-errors.txt
            ./TestResults/service-deadlines/shutdown-errors.txt

      - name: Upload coverage artifact
        if: always() && runner.os == 'Linux' && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: ./TestResults/**/coverage.cobertura.xml

      - name: Check Codecov token availability
        id: codecov-token
        if: runner.os == 'Linux'
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "$CODECOV_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && steps.codecov-token.outputs.available == 'true' && hashFiles('TestResults/**/coverage.cobertura.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          token: ${{ env.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false

      - name: Coverage upload skipped (missing CODECOV_TOKEN)
        if: runner.os == 'Linux' && steps.codecov-token.outputs.available != 'true'
        run: echo "Skipping Codecov upload because CODECOV_TOKEN is not configured."
